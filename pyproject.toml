[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scribelingo-agent"
version = "0.1.0"
description = "Autonomous AI agent that extracts video transcripts and generates structured linguistic study guides for advanced language learning"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper>=20231117",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "spacy>=3.7",
    "nltk>=3.8",
    "scikit-learn>=1.3",
    "moviepy>=1.0",
    "pydub>=0.25",
    "jinja2>=3.1",
]

[project.scripts]
scribelingo = "src.main:main"
